# Dependency updates, grouped so they arrive as at most two pull requests a
# week. CI, the guard and the preview check each one like any other pull
# request; the owner merges, and nothing reaches the live site without a release.
# Security fixes come as soon as they are published, outside the schedule. Other
# releases wait a week (cooldown): most compromised packages are caught and
# pulled within days.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Majors change behaviour (Next.js, OpenNext, Wrangler, the Supabase CLI): one
    # pull request each, so each can be read and tested on its own.
    commit-message:
      prefix: deps
    ignore:
      # Types follow the Node version the project runs on (.nvmrc, engines).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint must support a TypeScript major before it can be taken.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
